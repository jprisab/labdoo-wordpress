; OPcache - Labdoo production config
zend_extension=opcache.so

; JIT
opcache.jit=tracing
opcache.jit_buffer_size=64M

; Bytecode cache
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; En producción: no re-validar archivos en cada request
; IMPORTANTE: después de actualizar plugins/WP hay que hacer:
; sudo systemctl reload php8.3-fpm
opcache.validate_timestamps=0

; Necesario para anotaciones de PHPDoc (algunos plugins lo usan)
opcache.save_comments=1

; Evita que el pool se llene silenciosamente
opcache.enable_file_override=0
