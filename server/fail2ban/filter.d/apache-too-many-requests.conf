[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP/.*"

# Ignorar assets estáticos: no cuentan aunque vengan a cientos en la misma
# carga de página via HTTP/2 multiplexing
ignoreregex = "(GET|HEAD) [^"]*\.(css|js|jpe?g|png|gif|ico|svg|woff2?|ttf|eot|webp|map|mp4|otf|avif)(\?[^"]*)?" \d{3}
              "(GET|HEAD) /[^"]*wp-content/(cache|uploads)/[^"]+" \d{3}
              "(GET|HEAD) /[^"]*wp-includes/(css|js)/[^"]+" \d{3}
