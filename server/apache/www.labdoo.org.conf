<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName www.labdoo.org

	ServerAdmin contact@labdoo.org
	DocumentRoot /var/www/www.labdoo.org
	RedirectPermanent / https://www.labdoo.org/

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	
	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
	# include a line for only one particular virtual host. For example the
	# following line enables the CGI configuration for this host only
	# after it has been globally disabled with "a2disconf".
	#Include conf-available/serve-cgi-bin.conf
	<files xmlrpc.php>
    		Require all denied
	</files>



</VirtualHost>
<VirtualHost *:443>
    ServerName www.labdoo.org
    ServerAlias www.labdoo.org
    ServerAdmin admin@example.org
    DocumentRoot /var/www/www.labdoo.org
    <Directory /var/www/www.labdoo.org/>
       AllowOverride All
    </Directory>
    Protocols h2 http/1.1
    SSLEngine on

    # Security headers (S1)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always unset X-Powered-By
    SSLCertificateFile	/etc/ssl/certs/labdoo.org.crt
    SSLCertificateChainFile /etc/ssl/certs/labdoo-intermediate-chain.crt
    SSLCertificateKeyFile /etc/ssl/private/labdoo-cert.key
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # Bloqueo de botnet española (AS29119 Aire Networks) — 2026-05-20
    # IPs residenciales comprometidas que atacan wp-login.php de forma distribuida
    # Bot distribuido desde 2026-11-07 00:12 UTC (10 User-Agents moviles fijos, ~30k IPs) - 2026-11-09
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(iPhone;\ CPU\ iPhone\ OS\ 18_3\ like\ Mac\ OS\ X\)\ AppleWebKit/605\.1\.15\ \(KHTML,\ like\ Gecko\)\ CriOS/148\.0\.0\.0\ Mobile/15E148\ Safari/604\.1$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(Linux;\ Android\ 14;\ Pixel\ 8\ Pro\)\ AppleWebKit/537\.36\ \(KHTML,\ like\ Gecko\)\ Chrome/148\.0\.0\.0\ Mobile\ Safari/537\.36$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(Linux;\ Android\ 15;\ Pixel\ 9\)\ AppleWebKit/537\.36\ \(KHTML,\ like\ Gecko\)\ Chrome/151\.0\.0\.0\ Mobile\ Safari/537\.36$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(iPhone;\ CPU\ iPhone\ OS\ 18_4\ like\ Mac\ OS\ X\)\ AppleWebKit/605\.1\.15\ \(KHTML,\ like\ Gecko\)\ CriOS/151\.0\.0\.0\ Mobile/15E148\ Safari/604\.1$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(Linux;\ Android\ 15;\ CPH2653\)\ AppleWebKit/537\.36\ \(KHTML,\ like\ Gecko\)\ Chrome/149\.0\.0\.0\ Mobile\ Safari/537\.36$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(iPhone;\ CPU\ iPhone\ OS\ 18_2\ like\ Mac\ OS\ X\)\ AppleWebKit/605\.1\.15\ \(KHTML,\ like\ Gecko\)\ CriOS/149\.0\.0\.0\ Mobile/15E148\ Safari/604\.1$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(iPhone;\ CPU\ iPhone\ OS\ 18_6\ like\ Mac\ OS\ X\)\ AppleWebKit/605\.1\.15\ \(KHTML,\ like\ Gecko\)\ CriOS/150\.0\.0\.0\ Mobile/15E148\ Safari/604\.1$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(iPhone;\ CPU\ iPhone\ OS\ 18_5\ like\ Mac\ OS\ X\)\ AppleWebKit/605\.1\.15\ \(KHTML,\ like\ Gecko\)\ CriOS/147\.0\.0\.0\ Mobile/15E148\ Safari/604\.1$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(Linux;\ Android\ 14;\ 23127PN0CC\)\ AppleWebKit/537\.36\ \(KHTML,\ like\ Gecko\)\ Chrome/147\.0\.0\.0\ Mobile\ Safari/537\.36$" labdoo_bot
    SetEnvIf User-Agent "^Mozilla/5\.0\ \(Linux;\ Android\ 15;\ SM\-S938B\)\ AppleWebKit/537\.36\ \(KHTML,\ like\ Gecko\)\ Chrome/150\.0\.0\.0\ Mobile\ Safari/537\.36$" labdoo_bot
    <Location "/">
        <RequireAll>
            Require all granted
            Require not env labdoo_bot
            Require not ip 94.76.0.0/16
            Require not ip 88.148.0.0/16
            Require not ip 62.106.67.0/24
        </RequireAll>
    </Location>

    # xmlrpc.php bloqueado — Location específica tiene prioridad sobre Location /
    <Location "/xmlrpc.php">
        Require all denied
    </Location>

    # Labdoo AI Agent: chat n8n (casa) servido a través de www.labdoo.org — 2026-10-31
    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyVerifyDepth 5
    SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
    <Location "/labdoo-agent/N8N_WEBHOOK_ID_DEU/chat">
        ProxyPass        "https://N8N_HOST.example:5678/webhook/N8N_WEBHOOK_ID_DEU/chat" disablereuse=On retry=0 timeout=300
        ProxyPassReverse "https://N8N_HOST.example:5678/webhook/N8N_WEBHOOK_ID_DEU/chat"
    </Location>
    <Location "/labdoo-agent/labdoo-chat/chat">
        ProxyPass        "https://N8N_HOST.example:5678/webhook/labdoo-chat/chat" disablereuse=On retry=0 timeout=300
        ProxyPassReverse "https://N8N_HOST.example:5678/webhook/labdoo-chat/chat"
    </Location>
    <Location "/labdoo-agent/">
        RequestHeader unset Accept-Encoding
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|https://N8N_HOST.example:5678/webhook/|/labdoo-agent/|n"
    </Location>
</VirtualHost>
